[package]
name = "efx-motion-editor"
version = "2.1.0-beta2"
description = "EFX Motion Editor"
authors = ["EFX Lab"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "efx_motion_editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
script-library-test-support = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["devtools", "protocol-asset"] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-dialog = "2.7.3"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parser is not correctly rounded
# and can land 1 ULP off the value ECMAScript produces for the same decimal
# text. The canonical physical hash compares those doubles bit-for-bit, so a
# mis-parse silently forks the revision. See `canonical_number` in
# src/services/script_library.rs.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
image = { version = "0.25", features = ["jpeg", "png", "tiff", "webp"] }
webp = "0.3.1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-fs = "2.5.2"
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1"
percent-encoding = "2.3.2"
serde_yaml = "0.9"
tauri-plugin-notification = "2.4.0"
reqwest = { version = "0.12", features = ["rustls-tls"] }
tokio = { version = "1", features = ["fs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSObject", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSResponder"] }
block2 = "0.6"
dispatch = "0.2"
